name: Build and deploy Node.js app to Azure Web App - camp-frontend
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
      - name: npm install and build
        working-directory: Frontend/Backoffice
        run: |
          npm install --legacy-peer-deps
          npx ng build --configuration=production -- --no-progress 2>&1 || npx ng build
      - name: List dist contents
        working-directory: Frontend/Backoffice
        run: |
          find dist/ -type f | head -20
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: Frontend/Backoffice/dist/backoffice-dashboard/browser
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EF17F6049C8A41A7A357C7DC6FC79E4C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_51CF5BCB8EE440CC8EEC1E8BE160C9CD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_131050BC95D048BE99D8A01EAD47B648 }}
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'camp-frontend'
          slot-name: 'Production'
          package: .
